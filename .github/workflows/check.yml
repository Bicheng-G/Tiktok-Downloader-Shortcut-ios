name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[browser,test]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_shortcut.py
      - run: git diff --exit-code -- src
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [http, auto]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target ${{ matrix.target }} -t resolver:test .
      - name: Start and check liveness
        shell: bash
        run: |
          docker run -d --name resolver -p 8000:8000 -e DOUYIN_API_TOKEN=ci-only-not-a-deployment-token resolver:test
          trap 'docker logs resolver; docker rm -f resolver' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 --fail --silent --show-error http://localhost:8000/health
          if [ '${{ matrix.target }}' = auto ]; then
            docker exec resolver python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()"
          fi
